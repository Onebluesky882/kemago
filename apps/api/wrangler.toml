name = "fullstack-builder-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
RESEND_API_KEY = ""
STRIPE_SECRET_KEY = ""
STRIPE_PUBLISHABLE_KEY = ""
STRIPE_WEBHOOK_SECRET = ""
R2_ACCOUNT_ID = "YOUR_R2_ACCOUNT_ID"
R2_BUCKET_NAME = "gover-agent-storage"
GITHUB_TOKEN = ""
GITHUB_REPO_OWNER = "Onebluesky882"
GITHUB_TEMPLATE_REPO = "goveragent-template"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gover-agent-storage"

[[d1_databases]]
binding = "DB"
database_name = "gover-agent-db"
database_id = "YOUR_D1_DATABASE_ID"
