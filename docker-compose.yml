services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - coarea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/api-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      THAIBULK_SMS_KEY: ${THAIBULK_SMS_KEY}
      THAIBULK_SMS_SECRET: ${THAIBULK_SMS_SECRET}
      SMS_SENDER: ${SMS_SENDER}
      JWT_SECRET: ${JWT_SECRET}
      SMSMKT_API_KEY: ${SMSMKT_API_KEY}
      SMSMKT_SECRET_KEY: ${SMSMKT_SECRET_KEY}
      SMSMKT_PROJECT_KEY: ${SMSMKT_PROJECT_KEY}
      SMSMKT_SENDER: ${SMSMKT_SENDER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "${PORT}:${PORT}"

  ws:
    build:
      context: ./backend/ws-go
    restart: unless-stopped
    environment:
      WS_PORT: ${WS_PORT}
    ports:
      - "${WS_PORT}:${WS_PORT}"

volumes:
  coarea_postgres_data:
